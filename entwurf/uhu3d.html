 const cv=document.createElement('canvas');cv.width=1024;cv.height=Math.round(1024*(NY-1)/(NX-1));const c=cv.getContext('2d');c.fillStyle='#000';c.fillRect(0,0,cv.width,cv.height);c.fillStyle='#fff';c.beginPath();
 ZONE.forEach((p,i)=>{const x=(p[0]-E0)/CELL/(NX-1)*cv.width,y=(N1-p[1])/CELL/(NY-1)*cv.height;i?c.lineTo(x,y):c.moveTo(x,y)});c.closePath();c.fill();
 const mask=new THREE.CanvasTexture(cv);

 scene.add(new THREE.Mesh(lg,new THREE.MeshBasicMaterial({color:RED,transparent:true,opacity:.26,alphaMap:mask,side:THREE.DoubleSide,depthWrite:false})));

const cz=ZONE.reduce((a,p)=>[a[0]+p[0]/ZONE.length,a[1]+p[1]/ZONE.length],[0,0]);

 {html:'Landeplatz',e:691988,n:5283238,up:1.5},
 {html:'Klein-Lanzarote',e:692648,n:5282600,up:1.5}];
LB.forEach(l=>{l.el=document.createElement('span');l.el.className='lbl'+(l.cls?' '+l.cls:'');l.el.innerHTML=l.html;document.body.appendChild(l.el);l.v=new THREE.Vector3(X(l.e),Y(hAt(l.e,l.n))+l.up,Zc(l.n))});

const C=new THREE.Vector3(X(cz[0]),Y(hAt(cz[0],cz[1]))+8,Zc(cz[1]));
let az=-2.35,el=.52,dist=175,auto=!/[?&]static/.test(location.search),last=performance.now(),idle=0;
function place(){cam.position.set(C.x+dist*Math.cos(el)*Math.sin(az),C.y+dist*Math.sin(el),C.z+dist*Math.cos(el)*Math.cos(az));cam.lookAt(C)}
function resize(){const w=box.clientWidth,h=box.clientHeight;R.setSize(w,h);cam.aspect=w/h;cam.fov=w<h?50:40;dist=w<h?165:175;if(w<h&&el<.7)el=.78;cam.updateProjectionMatrix()}
addEventListener('resize',resize);resize();
let drag=null;box.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,az,el};box.setPointerCapture(e.pointerId);idle=0});
box.addEventListener('pointermove',e=>{if(!drag)return;az=drag.az-(e.clientX-drag.x)*.006;el=Math.max(.15,Math.min(1.2,drag.el+(e.clientY-drag.y)*.004));idle=0});
box.addEventListener('pointerup',()=>{drag=null});
const rb=document.getElementById('rot');rb.onclick=()=>{auto=!auto;rb.textContent=auto?'Drehung anhalten':'Drehen'};
const tmp=new THREE.Vector3();
function labels(){const w=box.clientWidth,h=box.clientHeight;LB.forEach(l=>{tmp.copy(l.v).project(cam);const vis=tmp.z<1;l.el.style.display=vis?'':'none';l.el.style.left=((tmp.x+1)/2*w)+'px';l.el.style.top=((1-tmp.y)/2*h)+'px'})}
function loop(t){const dt=Math.min(50,t-last);last=t;idle+=dt;if(auto&&!drag&&idle>1500)az+=dt*.00009;place();R.render(scene,cam);labels();requestAnimationFrame(loop)}
place();requestAnimationFrame(loop);
